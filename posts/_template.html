<!DOCTYPE html>
<html lang="en">
<!--
  ✎ HOW TO WRITE A NEW POST
  1. Copy this file and rename it, e.g. posts/winter-in-roorkee.html
  2. Change the title (two places), the meta line, and write your words below.
  3. Add it to the `posts` list in js/data.js so it shows up on the writing page.

  For a POEM: put the whole poem inside <div class="poem"> ... </div>
  Line breaks are kept exactly as you type them.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POST TITLE · riya's corner ✿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="../images/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="writing" data-root="../">
  <header id="site-header"></header>

  <main>
    <article class="post tape">
      <div class="meta">poem · 1 Dec 2026</div>
      <h1>POST TITLE</h1>

      <p>Write a normal paragraph like this.</p>

      <blockquote>A favourite line or a sher can go in a quote box like this.</blockquote>

      <div class="poem">first line of the poem
second line
third line

a new stanza after a blank line</div>

      <p class="signoff">love, riya ✿</p>
    </article>
    <div style="text-align:center"><a class="back" href="../writing.html">← back to all writing</a></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
